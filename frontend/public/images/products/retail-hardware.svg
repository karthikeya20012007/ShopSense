<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="hwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#hwBg)"/>

  <!-- Enterprise Edge Gateway Hub Body -->
  <rect x="100" y="70" width="200" height="135" rx="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" filter="url(#hwShadow)"/>
  <rect x="110" y="80" width="180" height="115" rx="10" fill="#1e293b"/>

  <!-- Status / Channel LED Row -->
  <g transform="translate(130, 95)">
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
    <circle cx="20" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="40" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="60" cy="0" r="5" fill="#0ea5e9"/>
    <circle cx="80" cy="0" r="5" fill="#10b981"/>
    <circle cx="100" cy="0" r="5" fill="#eab308"/>
    <circle cx="120" cy="0" r="5" fill="#3b82f6"/>
    <circle cx="140" cy="0" r="5" fill="#10b981"/>
  </g>

  <!-- Industrial Port Matrix (Ethernet, USB, RS-232 Serial) -->
  <rect x="125" y="125" width="40" height="28" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <rect x="133" y="133" width="24" height="14" rx="2" fill="#334155"/>
  <text x="145" y="162" font-family="monospace" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle">LAN 1</text>

  <rect x="180" y="125" width="40" height="28" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <rect x="188" y="133" width="24" height="14" rx="2" fill="#334155"/>
  <text x="200" y="162" font-family="monospace" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle">LAN 2</text>

  <rect x="235" y="125" width="40" height="28" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <rect x="245" y="130" width="20" height="8" rx="1" fill="#38bdf8"/>
  <rect x="245" y="142" width="20" height="8" rx="1" fill="#38bdf8"/>
  <text x="255" y="162" font-family="monospace" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle">USB 3.0</text>

  <!-- Metal Heat Dissipation Fins on Sides -->
  <rect x="88" y="90" width="12" height="95" rx="2" fill="#334155"/>
  <line x1="88" y1="105" x2="100" y2="105" stroke="#1e293b" stroke-width="2"/>
  <line x1="88" y1="120" x2="100" y2="120" stroke="#1e293b" stroke-width="2"/>
  <line x1="88" y1="135" x2="100" y2="135" stroke="#1e293b" stroke-width="2"/>
  <line x1="88" y1="150" x2="100" y2="150" stroke="#1e293b" stroke-width="2"/>
  <line x1="88" y1="165" x2="100" y2="165" stroke="#1e293b" stroke-width="2"/>

  <rect x="300" y="90" width="12" height="95" rx="2" fill="#334155"/>
  <line x1="300" y1="105" x2="312" y2="105" stroke="#1e293b" stroke-width="2"/>
  <line x1="300" y1="120" x2="312" y2="120" stroke="#1e293b" stroke-width="2"/>
  <line x1="300" y1="135" x2="312" y2="135" stroke="#1e293b" stroke-width="2"/>
  <line x1="300" y1="150" x2="312" y2="150" stroke="#1e293b" stroke-width="2"/>
  <line x1="300" y1="165" x2="312" y2="165" stroke="#1e293b" stroke-width="2"/>

  <!-- Title / Specification -->
  <text x="200" y="278" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Enterprise Retail Hardware Hub &amp; Gateway</text>
</svg>

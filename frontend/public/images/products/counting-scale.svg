<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="scaleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="metalPlatter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="scaleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#scaleBg)"/>

  <!-- Stainless Steel Weighing Platter (Top Platform) -->
  <rect x="70" y="85" width="260" height="28" rx="5" fill="url(#metalPlatter)" stroke="#94a3b8" stroke-width="2" filter="url(#scaleShadow)"/>
  <rect x="80" y="90" width="240" height="6" rx="2" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Scale Cast Base Housing -->
  <path d="M85 113 h230 l15 95 h-260 z" fill="#1e293b" filter="url(#scaleShadow)"/>
  <rect x="80" y="208" width="240" height="12" rx="4" fill="#0f172a"/>

  <!-- Adjustable Rubber Feet -->
  <rect x="95" y="220" width="20" height="8" rx="2" fill="#334155"/>
  <rect x="285" y="220" width="20" height="8" rx="2" fill="#334155"/>

  <!-- Front 3-Window Backlit Piece-Counting LCD Display -->
  <rect x="95" y="125" width="210" height="42" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Window 1: Total Weight (kg) -->
  <rect x="100" y="130" width="62" height="32" rx="2" fill="#1e293b"/>
  <text x="131" y="138" font-family="system-ui,sans-serif" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle">WEIGHT (kg)</text>
  <text x="131" y="155" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">12.500</text>

  <!-- Window 2: Unit Weight (g/pc) -->
  <rect x="169" y="130" width="62" height="32" rx="2" fill="#1e293b"/>
  <text x="200" y="138" font-family="system-ui,sans-serif" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle">UNIT WT (g)</text>
  <text x="200" y="155" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">25.00</text>

  <!-- Window 3: Total Count (Pcs) -->
  <rect x="238" y="130" width="62" height="32" rx="2" fill="#1e293b"/>
  <text x="269" y="138" font-family="system-ui,sans-serif" font-size="6" font-weight="700" fill="#94a3b8" text-anchor="middle">TOTAL COUNT</text>
  <text x="269" y="155" font-family="monospace" font-size="13" font-weight="800" fill="#10b981" text-anchor="middle">500 pcs</text>

  <!-- Numeric & Function Membrane Keypad -->
  <g transform="translate(100, 175)">
    <!-- Function keys -->
    <rect x="0" y="0" width="26" height="12" rx="2" fill="#0284c7"/>
    <text x="13" y="9" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">TARE</text>

    <rect x="32" y="0" width="26" height="12" rx="2" fill="#0284c7"/>
    <text x="45" y="9" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">ZERO</text>

    <rect x="64" y="0" width="26" height="12" rx="2" fill="#2563eb"/>
    <text x="77" y="9" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">SMPL</text>

    <!-- Keypad matrix -->
    <circle cx="108" cy="6" r="4" fill="#334155"/>
    <circle cx="124" cy="6" r="4" fill="#334155"/>
    <circle cx="140" cy="6" r="4" fill="#334155"/>
    <circle cx="156" cy="6" r="4" fill="#334155"/>
    <circle cx="172" cy="6" r="4" fill="#334155"/>

    <circle cx="188" cy="6" r="5" fill="#10b981"/>
    <text x="188" y="9" font-family="system-ui,sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">OK</text>
  </g>

  <!-- Level Bubble Indicator -->
  <circle cx="310" cy="180" r="7" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <circle cx="310" cy="180" r="3" fill="#10b981"/>

  <!-- Title / Specification -->
  <text x="200" y="278" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">High-Precision Digital Piece-Counting Scale</text>
</svg>

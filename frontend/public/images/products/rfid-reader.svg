<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rfidBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="rfidShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#rfidBg)"/>

  <!-- UHF RFID Portal Antenna Panel -->
  <rect x="125" y="45" width="150" height="150" rx="16" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" filter="url(#rfidShadow)"/>
  <rect x="135" y="55" width="130" height="130" rx="12" fill="#1e293b"/>

  <!-- Radio Frequency Wave Rings (UHF 865-928 MHz) -->
  <path d="M165 120 a35 35 0 0 1 70 0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M152 120 a48 48 0 0 1 96 0" stroke="#0ea5e9" stroke-width="3.5" stroke-dasharray="8,4" stroke-linecap="round" fill="none"/>
  <path d="M140 120 a60 60 0 0 1 120 0" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Center Active Transceiver Core -->
  <circle cx="200" cy="120" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="200" cy="120" r="6" fill="#10b981"/>

  <!-- Industrial Mounting Mast & Swivel Arm -->
  <rect x="188" y="195" width="24" height="45" fill="#475569"/>
  <circle cx="200" cy="205" r="5" fill="#94a3b8"/>
  <path d="M150 240 h100 l10 12 h-120 z" fill="#1e293b" filter="url(#rfidShadow)"/>

  <!-- RFID Asset Tags Featured in Foreground -->
  <!-- Tag 1: Flexible Adhesive UHF Inlay Tag -->
  <g transform="translate(45, 110) rotate(-12)" filter="url(#rfidShadow)">
    <rect x="0" y="0" width="70" height="35" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M10 18 h50" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <rect x="28" y="12" width="14" height="12" rx="2" fill="#0284c7"/>
    <text x="35" y="21" font-family="monospace" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">EPC</text>
  </g>

  <!-- Tag 2: Rugged Industrial Hard Tag -->
  <g transform="translate(290, 110) rotate(15)" filter="url(#rfidShadow)">
    <rect x="0" y="0" width="65" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="10" cy="15" r="4" fill="#94a3b8"/>
    <circle cx="55" cy="15" r="4" fill="#94a3b8"/>
    <rect x="22" y="10" width="22" height="10" rx="2" fill="#0284c7"/>
    <text x="33" y="18" font-family="monospace" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">UHF</text>
  </g>

  <!-- Status Diagnostics -->
  <circle cx="145" cy="65" r="3" fill="#10b981"/>
  <circle cx="155" cy="65" r="3" fill="#38bdf8"/>
  <circle cx="165" cy="65" r="3" fill="#eab308"/>

  <!-- Title / Specification -->
  <text x="200" y="278" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">UHF RFID Multi-Portal Gateway &amp; Tag Array</text>
</svg>

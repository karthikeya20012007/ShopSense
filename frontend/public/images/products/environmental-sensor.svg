<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sensBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sensShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#sensBg)"/>

  <!-- External High-Gain LoRaWAN / BLE Omni Antenna -->
  <line x1="200" y1="20" x2="200" y2="70" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="18" r="4" fill="#334155"/>
  <rect x="194" y="65" width="12" height="10" rx="2" fill="#475569"/>

  <!-- IP67 Ruggedized Enclosure Box -->
  <rect x="135" y="70" width="130" height="150" rx="16" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" filter="url(#sensShadow)"/>
  <rect x="145" y="80" width="110" height="130" rx="10" fill="#1e293b"/>

  <!-- Weatherproof Flange Screws -->
  <circle cx="145" cy="80" r="3" fill="#64748b"/>
  <circle cx="255" cy="80" r="3" fill="#64748b"/>
  <circle cx="145" cy="210" r="3" fill="#64748b"/>
  <circle cx="255" cy="210" r="3" fill="#64748b"/>

  <!-- Center Circular Climate Display Ring -->
  <circle cx="200" cy="135" r="36" fill="#0f172a" stroke="#0ea5e9" stroke-width="3"/>

  <!-- Temperature & Humidity Readings -->
  <text x="200" y="132" font-family="system-ui,sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">-4.2°C</text>
  <text x="200" y="148" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">58% RH</text>

  <!-- Cold Chain / Climate Status Indicator Bar -->
  <rect x="165" y="180" width="70" height="12" rx="3" fill="#334155"/>
  <rect x="165" y="180" width="45" height="12" rx="3" fill="#0284c7"/>
  <text x="200" y="189" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">COLD CHAIN OK</text>

  <!-- External Stainless Steel Sensor Probe Cable Extruding from Bottom -->
  <path d="M200 220 v30 c0 10 -15 15 -15 25" stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="178" y="260" width="14" height="20" rx="3" fill="#94a3b8"/>

  <!-- Wireless Link Heartbeat LED -->
  <circle cx="160" cy="95" r="4" fill="#10b981"/>

  <!-- Title / Specification -->
  <text x="200" y="278" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">IoT Cold-Chain &amp; Ambient Climate Sensor</text>
</svg>
